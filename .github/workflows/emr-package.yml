name: emr package
on:
  push:
    branches: [emr/package]
  pull_request:
    branches: [emr/package]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: emr-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate source package
        run: ./EMRPackage/tools/validate-release.sh
