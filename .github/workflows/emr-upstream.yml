name: emr upstream release check
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: emr-upstream-sync
  cancel-in-progress: false
jobs:
  review-update:
    if: github.repository == 'emrearibulan/emr-vorssaint-package'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: emr/package
          fetch-depth: 0
      - name: Configure bot identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Check stable release and prepare a tested review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./EMRPackage/tools/sync-upstream.sh
